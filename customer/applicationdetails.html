<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application Details</title>

    <link rel="stylesheet" href="applicationdetails.css">

</head>


<body>


<div class="container">


    <h1>Application Details</h1>


    <div class="details-card">


        <div class="detail-row">

            <span>Application ID</span>
            <p id="applicationId"></p>

        </div>


        <div class="detail-row">

            <span>Customer Name</span>
            <p id="name"></p>

        </div>


        <div class="detail-row">

            <span>Mobile</span>
            <p id="mobile"></p>

        </div>


        <div class="detail-row">

            <span>Email</span>
            <p id="email"></p>

        </div>


        <div class="detail-row">

            <span>Loan Type</span>
            <p id="loanType"></p>

        </div>


        <div class="detail-row">

            <span>Loan Amount</span>
            <p id="amount"></p>

        </div>


        <div class="detail-row">

            <span>Tenure</span>
            <p id="tenure"></p>

        </div>


        <div class="detail-row">

            <span>Purpose</span>
            <p id="purpose"></p>

        </div>


        <div class="detail-row">

            <span>Interest Rate</span>
            <p id="interestRate"></p>

        </div>


        <div class="detail-row">

            <span>Interest Amount</span>
            <p id="interest"></p>

        </div>


        <div class="detail-row">

            <span>Total Payable</span>
            <p id="totalPayable"></p>

        </div>


        <div class="detail-row">

            <span>EMI</span>
            <p id="emi"></p>

        </div>


        <div class="detail-row">

            <span>Eligibility</span>
            <p id="eligibility"></p>

        </div>


        <div class="detail-row">

            <span>Risk Level</span>
            <p id="risk"></p>

        </div>


        <div class="detail-row">

            <span>Status</span>
            <p id="status"></p>

        </div>


    </div>


</div>


<script src="applicationdetails.js"></script>


</body>

</html>
