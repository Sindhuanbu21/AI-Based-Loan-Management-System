<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Officer Login</title>

    <link rel="stylesheet" href="officerlogin.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h2>Finance Officer Login</h2>

            <p>Please login to continue</p>

            <form id="officerLoginForm" autocomplete="off">

    <label>Email</label>

    <input
        type="email"
        id="officerEmail"
        name="officer_email"
        placeholder="Enter Officer Email"
        autocomplete="off"
        required>

    <label>Password</label>

    <input
        type="password"
        id="officerPassword"
        name="officer_password"
        placeholder="Enter Password"
        autocomplete="new-password"
        required>

    <button type="submit">
        Login
    </button>

</form>
        </div>

    </div>

    <script src="officerlogin.js"></script>

</body>

</html>
