<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Registration | Loan Vision Finance</title>

    <link rel="stylesheet" href="customerregister.css">

</head>

<body>

<div class="login-box">

    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
         alt="Customer">

    <h1>Loan Vision Finance</h1>

    <p class="subtitle">
        Smart Loan Management System
    </p>

    <h3 class="customer-title">
        👤 Customer Registration
    </h3>


    <form autocomplete="off">


    <input
        type="text"
        id="fullname"
        name="fullname"
        placeholder="Enter Full Name"
        autocomplete="new-name"
        required>


    <input
        type="tel"
        id="mobile"
        name="mobile"
        maxlength="10"
        placeholder="Enter 10 Digit Mobile Number"
        autocomplete="off"
        required>


    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter Email Address"
        autocomplete="new-email"
        required>


    <input
        type="text"
        id="username"
        name="username"
        placeholder="Create Username"
        autocomplete="new-username"
        required>


    <input
        type="password"
        id="password"
        name="password"
        placeholder="Create Password"
        autocomplete="new-password"
        required>


    <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm Password"
        autocomplete="new-password"
        required>


    <button type="button" onclick="registerCustomer()">
        Register
    </button>


    </form>


    <p id="message"></p>


    <p class="register-text">
        Already have an account?
        <a href="customerlogin.html">
            Login
        </a>
    </p>


    <p class="register-text">
        <a href="customerhome.html">
            ← Back to Home
        </a>
    </p>


    <p class="security">
        🔒 Your information is securely protected.
    </p>


</div>


<script src="customer.js"></script>


</body>

</html>
